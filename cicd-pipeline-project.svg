<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>End-to-End DevOps CI/CD Pipeline architecture</title>
  <desc>Node.js app is Dockerized, built and pushed to Amazon ECR via GitHub Actions, then deployed to Kubernetes using Helm, exposed through NGINX Ingress, and monitored with Prometheus and Grafana.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e6e6e6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#0d0d0d"/>

  <text x="40" y="46" font-family="Inter, sans-serif" font-size="12" letter-spacing="2" fill="#8a8a8a">END-TO-END DEVOPS CI/CD PIPELINE</text>
  <line x1="40" y1="60" x2="760" y2="60" stroke="#333" stroke-width="1"/>

  <g font-family="Inter, sans-serif">

    <rect x="40" y="110" width="120" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="100" y="135" text-anchor="middle" font-size="13" fill="#f2f2f2">Node.js</text>
    <text x="100" y="153" text-anchor="middle" font-size="11" fill="#9a9a9a">application</text>

    <line x1="160" y1="140" x2="196" y2="140" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="200" y="110" width="120" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="260" y="135" text-anchor="middle" font-size="13" fill="#f2f2f2">Docker</text>
    <text x="260" y="153" text-anchor="middle" font-size="11" fill="#9a9a9a">build image</text>

    <line x1="320" y1="140" x2="356" y2="140" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="360" y="110" width="140" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="430" y="135" text-anchor="middle" font-size="13" fill="#f2f2f2">GitHub Actions</text>
    <text x="430" y="153" text-anchor="middle" font-size="11" fill="#9a9a9a">CI/CD automation</text>

    <line x1="500" y1="140" x2="536" y2="140" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="540" y="110" width="130" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="605" y="135" text-anchor="middle" font-size="13" fill="#f2f2f2">Amazon ECR</text>
    <text x="605" y="153" text-anchor="middle" font-size="11" fill="#9a9a9a">image registry</text>

    <line x1="605" y1="170" x2="605" y2="200" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="605" y1="200" x2="290" y2="200" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="290" y1="200" x2="290" y2="226" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="80" y="230" width="420" height="130" rx="6" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="100" y="252" font-size="12" letter-spacing="1" fill="#9a9a9a">KUBERNETES CLUSTER</text>

    <rect x="110" y="270" width="150" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="185" y="296" text-anchor="middle" font-size="13" fill="#f2f2f2">Helm release</text>
    <text x="185" y="314" text-anchor="middle" font-size="11" fill="#9a9a9a">app deployment</text>

    <line x1="260" y1="303" x2="296" y2="303" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="300" y="270" width="180" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="390" y="296" text-anchor="middle" font-size="13" fill="#f2f2f2">NGINX Ingress</text>
    <text x="390" y="314" text-anchor="middle" font-size="11" fill="#9a9a9a">external traffic routing</text>

    <line x1="480" y1="303" x2="516" y2="303" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="555" y="298" text-anchor="middle" font-size="11" fill="#9a9a9a">users</text>
    <circle cx="555" cy="312" r="10" fill="none" stroke="#e6e6e6" stroke-width="1"/>

    <line x1="185" y1="336" x2="185" y2="380" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="120" y="384" width="140" height="50" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="190" y="405" text-anchor="middle" font-size="12" fill="#f2f2f2">Prometheus</text>
    <text x="190" y="421" text-anchor="middle" font-size="10" fill="#9a9a9a">metrics collection</text>

    <line x1="260" y1="409" x2="286" y2="409" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="290" y="384" width="140" height="50" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="360" y="405" text-anchor="middle" font-size="12" fill="#f2f2f2">Grafana</text>
    <text x="360" y="421" text-anchor="middle" font-size="10" fill="#9a9a9a">dashboards</text>

  </g>
</svg>
