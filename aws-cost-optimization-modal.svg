<svg viewBox="0 0 560 880" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AWS Cost Optimization Tool — detailed flow</title>
  <desc>GitHub Actions triggers a Python analyzer daily that uses Boto3 to scan EC2, EBS, Elastic IPs and snapshots in an AWS account, generates an HTML report, and emails it via SMTP to a recipient.</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e6e6e6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="880" fill="#0d0d0d"/>

  <text x="40" y="42" font-family="Inter, sans-serif" font-size="12" letter-spacing="2" fill="#8a8a8a">AWS COST OPTIMIZATION — DETAILED FLOW</text>
  <line x1="40" y1="56" x2="520" y2="56" stroke="#333" stroke-width="1"/>

  <g font-family="Inter, sans-serif">

    <rect x="40" y="176" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="202" text-anchor="middle" font-size="13" fill="#f2f2f2">GitHub Actions</text>
    <text x="280" y="220" text-anchor="middle" font-size="11" fill="#9a9a9a">daily trigger + secrets</text>

    <line x1="280" y1="234" x2="280" y2="266" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow3)"/>

    <rect x="40" y="270" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="296" text-anchor="middle" font-size="13" fill="#f2f2f2">Python Analyzer</text>
    <text x="280" y="314" text-anchor="middle" font-size="11" fill="#9a9a9a">Boto3 resource scan</text>

    <line x1="280" y1="328" x2="280" y2="360" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow3)"/>

    <rect x="40" y="364" width="480" height="194" rx="6" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="60" y="386" font-size="12" letter-spacing="1" fill="#9a9a9a">AWS ACCOUNT</text>

    <rect x="60" y="404" width="210" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="165" y="440" text-anchor="middle" font-size="13" fill="#f2f2f2">EC2</text>

    <rect x="290" y="404" width="210" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="395" y="440" text-anchor="middle" font-size="13" fill="#f2f2f2">EBS</text>

    <rect x="60" y="478" width="210" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="165" y="514" text-anchor="middle" font-size="13" fill="#f2f2f2">Elastic IPs</text>

    <rect x="290" y="478" width="210" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="395" y="514" text-anchor="middle" font-size="13" fill="#f2f2f2">Snapshots</text>

    <line x1="280" y1="558" x2="280" y2="590" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow3)"/>

    <rect x="40" y="594" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="620" text-anchor="middle" font-size="13" fill="#f2f2f2">HTML Report</text>
    <text x="280" y="638" text-anchor="middle" font-size="11" fill="#9a9a9a">utilization + savings summary</text>

    <line x1="280" y1="652" x2="280" y2="684" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow3)"/>

    <rect x="40" y="688" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="714" text-anchor="middle" font-size="13" fill="#f2f2f2">SMTP Email</text>
    <text x="280" y="732" text-anchor="middle" font-size="11" fill="#9a9a9a">daily delivery</text>

    <line x1="280" y1="746" x2="280" y2="778" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow3)"/>

    <circle cx="280" cy="798" r="16" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="836" text-anchor="middle" font-size="13" fill="#f2f2f2">Recipient</text>

  </g>
</svg>
