<svg viewBox="0 0 560 1030" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>End-to-End DevOps CI/CD Pipeline — detailed flow</title>
  <desc>A developer pushes to a GitHub repository, GitHub Actions builds and pushes a Docker image to Amazon ECR, Helm upgrades the release on a Kubernetes cluster running a Deployment and Service, NGINX Ingress exposes the application, and Prometheus and Grafana monitor it.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e6e6e6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="1030" fill="#0d0d0d"/>

  <text x="40" y="42" font-family="Inter, sans-serif" font-size="12" letter-spacing="2" fill="#8a8a8a">CI/CD PIPELINE — DETAILED FLOW</text>
  <line x1="40" y1="56" x2="520" y2="56" stroke="#333" stroke-width="1"/>

  <g font-family="Inter, sans-serif">

    <circle cx="280" cy="94" r="16" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="99" text-anchor="middle" font-size="13" fill="#f2f2f2">D</text>
    <text x="280" y="132" text-anchor="middle" font-size="13" fill="#f2f2f2">Developer</text>

    <line x1="280" y1="140" x2="280" y2="172" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="40" y="176" width="480" height="50" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="206" text-anchor="middle" font-size="13" fill="#f2f2f2">GitHub Repository</text>

    <line x1="280" y1="226" x2="280" y2="258" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="40" y="262" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="288" text-anchor="middle" font-size="13" fill="#f2f2f2">GitHub Actions</text>
    <text x="280" y="306" text-anchor="middle" font-size="11" fill="#9a9a9a">build &amp; push Docker image</text>

    <line x1="280" y1="320" x2="280" y2="352" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="40" y="356" width="480" height="50" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="386" text-anchor="middle" font-size="13" fill="#f2f2f2">Amazon ECR</text>

    <line x1="280" y1="406" x2="280" y2="438" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="40" y="442" width="480" height="50" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="472" text-anchor="middle" font-size="13" fill="#f2f2f2">Helm Upgrade</text>

    <line x1="280" y1="492" x2="280" y2="524" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="40" y="528" width="480" height="140" rx="6" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="60" y="550" font-size="12" letter-spacing="1" fill="#9a9a9a">KUBERNETES CLUSTER</text>

    <rect x="60" y="568" width="190" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="155" y="605" text-anchor="middle" font-size="13" fill="#f2f2f2">Deployment</text>

    <line x1="250" y1="601" x2="286" y2="601" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="310" y="568" width="190" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="405" y="605" text-anchor="middle" font-size="13" fill="#f2f2f2">Service</text>

    <line x1="280" y1="668" x2="280" y2="700" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="40" y="704" width="480" height="50" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="734" text-anchor="middle" font-size="13" fill="#f2f2f2">NGINX Ingress</text>

    <line x1="280" y1="754" x2="280" y2="786" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="40" y="790" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="816" text-anchor="middle" font-size="13" fill="#f2f2f2">Application</text>
    <text x="280" y="834" text-anchor="middle" font-size="11" fill="#9a9a9a">running pods</text>

    <line x1="280" y1="848" x2="280" y2="880" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow2)"/>

    <rect x="40" y="884" width="480" height="110" rx="6" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="60" y="906" font-size="12" letter-spacing="1" fill="#9a9a9a">MONITORING</text>

    <rect x="60" y="922" width="190" height="48" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="155" y="950" text-anchor="middle" font-size="12" fill="#f2f2f2">Prometheus</text>

    <rect x="310" y="922" width="190" height="48" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="405" y="950" text-anchor="middle" font-size="12" fill="#f2f2f2">Grafana</text>

  </g>
</svg>
