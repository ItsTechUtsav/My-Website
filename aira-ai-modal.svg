<svg viewBox="0 0 560 740" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Aira.AI — detailed flow</title>
  <desc>A user goes through a React and Vite frontend with protected routes, to an Express API secured with JWT auth, which talks to backend services — MongoDB for users and sessions, and OpenRouter for AI question generation and evaluation — powering a timed interview session and a final report with history.</desc>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e6e6e6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="740" fill="#0d0d0d"/>

  <text x="40" y="42" font-family="Inter, sans-serif" font-size="12" letter-spacing="2" fill="#8a8a8a">AIRA.AI — DETAILED FLOW</text>
  <line x1="40" y1="56" x2="520" y2="56" stroke="#333" stroke-width="1"/>

  <g font-family="Inter, sans-serif">

    <circle cx="280" cy="94" r="16" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="99" text-anchor="middle" font-size="13" fill="#f2f2f2">U</text>
    <text x="280" y="132" text-anchor="middle" font-size="13" fill="#f2f2f2">User</text>

    <line x1="280" y1="140" x2="280" y2="172" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow4)"/>

    <rect x="40" y="176" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="202" text-anchor="middle" font-size="13" fill="#f2f2f2">React + Vite</text>
    <text x="280" y="220" text-anchor="middle" font-size="11" fill="#9a9a9a">protected routes</text>

    <line x1="280" y1="234" x2="280" y2="266" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow4)"/>

    <rect x="40" y="270" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="296" text-anchor="middle" font-size="13" fill="#f2f2f2">Express API</text>
    <text x="280" y="314" text-anchor="middle" font-size="11" fill="#9a9a9a">JWT auth middleware</text>

    <line x1="280" y1="328" x2="280" y2="360" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow4)"/>

    <rect x="40" y="364" width="480" height="140" rx="6" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="60" y="386" font-size="12" letter-spacing="1" fill="#9a9a9a">BACKEND SERVICES</text>

    <rect x="60" y="404" width="190" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="155" y="434" text-anchor="middle" font-size="13" fill="#f2f2f2">MongoDB</text>
    <text x="155" y="452" text-anchor="middle" font-size="11" fill="#9a9a9a">users + sessions</text>

    <rect x="310" y="404" width="190" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="405" y="434" text-anchor="middle" font-size="13" fill="#f2f2f2">OpenRouter AI</text>
    <text x="405" y="452" text-anchor="middle" font-size="10" fill="#9a9a9a">questions + evaluation</text>

    <line x1="280" y1="504" x2="280" y2="536" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow4)"/>

    <rect x="40" y="540" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="566" text-anchor="middle" font-size="13" fill="#f2f2f2">Interview Session</text>
    <text x="280" y="584" text-anchor="middle" font-size="11" fill="#9a9a9a">timed Q&amp;A practice</text>

    <line x1="280" y1="598" x2="280" y2="630" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow4)"/>

    <rect x="40" y="634" width="480" height="58" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="280" y="660" text-anchor="middle" font-size="13" fill="#f2f2f2">Report + History</text>
    <text x="280" y="678" text-anchor="middle" font-size="11" fill="#9a9a9a">score + past sessions</text>

  </g>
</svg>
