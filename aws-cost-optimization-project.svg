<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AWS Cost Optimization Tool architecture</title>
  <desc>GitHub Actions runs a Python script on a daily schedule that uses Boto3 to scan EC2, EBS, Elastic IPs and snapshots in an AWS account, then generates an HTML report and emails it via SMTP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e6e6e6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#0d0d0d"/>

  <text x="40" y="46" font-family="Inter, sans-serif" font-size="12" letter-spacing="2" fill="#8a8a8a">AWS COST OPTIMIZATION TOOL</text>
  <line x1="40" y1="60" x2="760" y2="60" stroke="#333" stroke-width="1"/>

  <g font-family="Inter, sans-serif">

    <rect x="40" y="110" width="150" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="115" y="135" text-anchor="middle" font-size="13" fill="#f2f2f2">GitHub Actions</text>
    <text x="115" y="153" text-anchor="middle" font-size="11" fill="#9a9a9a">daily trigger + secrets</text>

    <line x1="190" y1="140" x2="226" y2="140" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="230" y="110" width="170" height="60" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="315" y="135" text-anchor="middle" font-size="13" fill="#f2f2f2">Python analyzer</text>
    <text x="315" y="153" text-anchor="middle" font-size="11" fill="#9a9a9a">Boto3 resource scan</text>

    <line x1="290" y1="170" x2="290" y2="200" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="290" y1="200" x2="290" y2="226" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="80" y="230" width="420" height="140" rx="6" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="100" y="252" font-size="12" letter-spacing="1" fill="#9a9a9a">AWS ACCOUNT</text>

    <rect x="100" y="270" width="85" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="142" y="308" text-anchor="middle" font-size="12" fill="#f2f2f2">EC2</text>

    <rect x="195" y="270" width="85" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="237" y="308" text-anchor="middle" font-size="12" fill="#f2f2f2">EBS</text>

    <rect x="290" y="270" width="85" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="332" y="302" text-anchor="middle" font-size="11" fill="#f2f2f2">Elastic</text>
    <text x="332" y="316" text-anchor="middle" font-size="11" fill="#f2f2f2">IPs</text>

    <rect x="385" y="270" width="85" height="66" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="427" y="308" text-anchor="middle" font-size="11" fill="#f2f2f2">Snapshots</text>

    <line x1="290" y1="370" x2="290" y2="400" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="290" y1="400" x2="245" y2="400" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="245" y1="400" x2="245" y2="380" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="150" y="384" width="190" height="50" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="245" y="405" text-anchor="middle" font-size="12" fill="#f2f2f2">HTML report</text>
    <text x="245" y="421" text-anchor="middle" font-size="10" fill="#9a9a9a">utilization + savings summary</text>

    <line x1="340" y1="409" x2="376" y2="409" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="380" y="384" width="190" height="50" rx="4" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="475" y="405" text-anchor="middle" font-size="12" fill="#f2f2f2">SMTP email</text>
    <text x="475" y="421" text-anchor="middle" font-size="10" fill="#9a9a9a">daily delivery</text>

    <line x1="570" y1="409" x2="606" y2="409" stroke="#8a8a8a" stroke-width="1" marker-end="url(#arrow)"/>
    <circle cx="630" cy="409" r="10" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    <text x="648" y="413" font-size="11" fill="#9a9a9a">recipient</text>

  </g>
</svg>
